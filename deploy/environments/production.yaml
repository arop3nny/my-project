auth:
  url: https://auth.example.com
frontend:
  replicaCount: 2
  pdb: { enabled: true, minAvailable: 1 }
backend:
  replicaCount: 2
  pdb: { enabled: true, minAvailable: 1 }
  # Enable after installing metrics-server and choosing scaling thresholds.
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
gateway:
  name: platform-edge
  namespace: edge-production
  hostname: app.example.com
# imagePullSecrets:
