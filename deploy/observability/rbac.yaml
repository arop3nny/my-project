apiVersion: v1
kind: ServiceAccount
metadata: { name: observability-deployer }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: observability-deployer }
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, services, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [referencegrants]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: observability-deployer }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: observability-deployer }
subjects: [{ kind: ServiceAccount, name: observability-deployer }]
