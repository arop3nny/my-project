{{- if .Values.realm.import }}
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: platform-realm
spec:
  keycloakCRName: {{ .Values.keycloak.name }}
  realm:
    {{- .Files.Get "files/platform-realm.json" | replace "${APP_ORIGIN}" .Values.realm.appOrigin | fromJson | toYaml | nindent 4 }}
{{- end }}
