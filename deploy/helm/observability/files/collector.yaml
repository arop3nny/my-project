extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /data/queue
    create_directory: true
receivers:
  otlp:
    protocols:
      grpc: { endpoint: '0.0.0.0:4317' }
      http: { endpoint: '0.0.0.0:4318' }
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  resource:
    attributes:
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert
  # Gateway spans can contain OAuth redirect codes in URL attributes. Remove them.
  attributes/privacy:
    actions:
      - { key: url.full, action: delete }
      - { key: url.query, action: delete }
      - { key: http.url, action: delete }
      - { key: http.target, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue: { enabled: true, storage: file_storage, queue_size: 1000 }
    retry_on_failure: { enabled: true, max_elapsed_time: 300s }
  otlp_http/tempo:
    endpoint: http://tempo:4318
    sending_queue: { enabled: true, storage: file_storage, queue_size: 1000 }
    retry_on_failure: { enabled: true, max_elapsed_time: 300s }
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    sending_queue: { enabled: true, storage: file_storage, queue_size: 1000 }
    retry_on_failure: { enabled: true, max_elapsed_time: 300s }
service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/privacy, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/privacy, batch]
      exporters: [otlp_http/loki]
