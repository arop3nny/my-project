apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app.kubernetes.io/name: platform-observability, app.kubernetes.io/component: collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, appProtocol: grpc }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: otel-collector
spec:
  serviceName: otel-collector
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: platform-observability, app.kubernetes.io/component: collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: platform-observability, app.kubernetes.io/component: collector }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: {{ .Values.collector.image | quote }}
          args: [--config=/etc/platform/collector.yaml]
          env:
            - { name: DEPLOYMENT_ENVIRONMENT, value: {{ .Values.environment | quote }} }
          ports:
            - { name: health, containerPort: 13133 }
          startupProbe:
            httpGet: { path: /, port: health }
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/platform, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: observability-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: 2Gi }
