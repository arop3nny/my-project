# Telemetry is operator-only. No HTTPRoute or public ingestion endpoint is created.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-private
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: platform-{{ .Values.environment }} }
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [backend, worker] }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-namespace: edge-{{ .Values.environment }}
              gateway.envoyproxy.io/owning-gateway-name: platform-edge
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-telemetry
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
      namespace: edge-{{ .Values.environment }}
  to:
    - group: ""
      kind: Service
      name: otel-collector
