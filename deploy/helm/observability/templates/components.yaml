{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: { app.kubernetes.io/name: platform-observability, app.kubernetes.io/component: {{ $name }} }
  ports:
    - { name: http, port: {{ $component.port }}, targetPort: http }
    {{- if eq $name "tempo" }}
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: platform-observability, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: platform-observability, app.kubernetes.io/component: {{ $name }} }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $component.uid }}
        runAsGroup: {{ $component.uid }}
        fsGroup: {{ $component.uid }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ $component.image | quote }}
          args: {{ toJson $component.args }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: {{ $component.port }} }
          startupProbe:
            httpGet: { path: {{ $component.probe }}, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: {{ $component.probe }}, port: http }
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- if eq $name "grafana" }}
          env:
            - { name: GF_PATHS_DATA, value: /data/grafana }
            - { name: GF_PATHS_LOGS, value: /tmp/logs }
            - { name: GF_PATHS_PLUGINS, value: /data/plugins }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: {{ $.Values.grafanaAdminSecret }}, key: username }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.grafanaAdminSecret }}, key: password }
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /etc/platform, readOnly: true }
            {{- if eq $name "tempo" }}
            - { name: data, mountPath: /var/tempo }
            {{- end }}
            {{- if eq $name "grafana" }}
            - { name: grafana, mountPath: /etc/grafana/provisioning/datasources/platform.yaml, subPath: datasources.yaml, readOnly: true }
            - { name: grafana, mountPath: /etc/grafana/provisioning/dashboards/platform.yaml, subPath: dashboards.yaml, readOnly: true }
            - { name: grafana, mountPath: /etc/grafana/dashboards/platform.json, subPath: platform.json, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: observability-config }
        - name: grafana
          configMap: { name: grafana-provisioning }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $.Values.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ $component.storage }} }
{{- end }}
