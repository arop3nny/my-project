redisImage: redis:8.10.1-alpine
storageClass: ""
queue:
  storageSize: 10Gi
  maxmemory: 512mb
  existingSecret: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
cache:
  maxmemory: 128mb
  existingSecret: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
kafka:
  version: 4.3.1
  replicas: 3
  storageSize: 50Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
