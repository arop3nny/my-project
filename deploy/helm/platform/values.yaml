nameOverride: ""
fullnameOverride: ""
releaseCommit: "local"
imagePullSecrets: []
auth:
  url: https://auth.example.com
  realm: platform
  clientId: platform-web
  audience: platform-api
database:
  host: platform-db-rw
  name: platform
  credentialsSecret: platform-db-runtime
  workerCredentialsSecret: platform-db-worker
  migrationCredentialsSecret: platform-db-app
  caSecret: platform-db-ca

serviceAccount:
  create: true
  name: ""
  annotations: {}

frontend:
  replicaCount: 1
  image:
    repository: acme-frontend
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  port: 8080
  servicePort: 80
  runAsUser: 101
  env: {}
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

backend:
  replicaCount: 1
  image:
    repository: acme-backend
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  port: 3000
  servicePort: 3000
  runAsUser: 1000
  env:
    NODE_ENV: production
    PORT: "3000"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

gateway:
  name: platform-edge
  namespace: edge-staging
  hostname: staging.example.com

nodeSelector: {}
tolerations: []

tests:
  image: busybox:1.37

telemetry:
  enabled: true
  endpoint: http://otel-collector.observability-staging.svc.cluster.local:4318
  environment: staging
  samplingRatio: "0.1"

worker:
  replicaCount: 1
  port: 3002
  runAsUser: 1000
  env: { NODE_ENV: production, PORT: "3002", WORKER_CONCURRENCY: "2" }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
  pdb: { enabled: false, minAvailable: 1 }
messaging:
  queueHost: platform-queue
  queueSecret: platform-queue
  cacheHost: platform-cache
  cacheSecret: platform-cache
  kafkaBrokers: platform-kafka-kafka-bootstrap:9093
  kafkaCredentialsSecret: platform-worker
  kafkaCaSecret: platform-kafka-cluster-ca-cert
