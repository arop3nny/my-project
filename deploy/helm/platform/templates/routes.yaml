{{- range $app := list "frontend" "backend" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "platform.fullname" $ }}-{{ $app }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: app-https
  hostnames: [{{ $.Values.gateway.hostname | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ if eq $app "backend" }}/api{{ else }}/{{ end }}
      timeouts:
        request: 30s
        backendRequest: 15s
      backendRefs:
        - name: {{ include "platform.fullname" $ }}-{{ $app }}
          port: {{ (index $.Values $app).servicePort }}
{{- end }}
