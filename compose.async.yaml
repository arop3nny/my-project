services:
  queue:
    image: redis:8.10.1-alpine
    ports: ["127.0.0.1:6390:6379"]
    environment:
      REDISCLI_AUTH: ${QUEUE_REDIS_PASSWORD:?Set QUEUE_REDIS_PASSWORD}
    command: [sh, -ec, 'exec redis-server --requirepass "$$REDISCLI_AUTH" --appendonly yes --appendfsync always --maxmemory 256mb --maxmemory-policy noeviction']
    volumes: [queue-data:/data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 20
  cache:
    image: redis:8.10.1-alpine
    ports: ["127.0.0.1:6391:6379"]
    environment:
      REDISCLI_AUTH: ${CACHE_REDIS_PASSWORD:?Set CACHE_REDIS_PASSWORD}
    command: [sh, -ec, 'exec redis-server --requirepass "$$REDISCLI_AUTH" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru']
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:4.3.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      retries: 20
volumes:
  queue-data:
  kafka-data:
