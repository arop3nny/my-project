name: platform-development
services:
  postgres:
    image: postgres:17.11-alpine
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - platform-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: [start-dev, --import-realm]
    ports: ["127.0.0.1:8081:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_LOG_CONSOLE_OUTPUT: json
      KC_HOSTNAME: http://localhost:8081
      APP_ORIGIN: http://localhost:4200
    volumes:
      - keycloak-dev-data:/opt/keycloak/data
      - ./deploy/helm/identity/files/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
volumes:
  platform-dev-data:
  keycloak-dev-data:
