name: Deploy application database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Application database environment (CloudNativePG must already be installed)
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: data-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: data-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - name: Deploy the database and wait for readiness
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash tools/helm/data.sh
