# Omit query strings, cookies and authorization headers from central logs.
log_format platform escape=json '{"service":"platform-frontend","method":"$request_method","status":$status,"duration":$request_time}';
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /dev/stdout platform;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  location = /health/live { access_log off; return 200 'ok'; }
  location = /health/ready { access_log off; return 200 'ok'; }
  location /api/ { return 404; }
  location = /config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
